[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-orientation-detector"
version = "2.0.0"
description = "Hệ thống kiểm tra chất lượng tài liệu PDF scan & nhận diện dấu độ mật theo kiến trúc 5 phân khu (AI Engine, Backend Services, Frontend Dashboard, Training Lab, Benchmarks)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "pandas>=2.2.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pdf-orientation-detector = "backend.api.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_engine*", "backend*", "frontend*", "benchmarks*", "training_lab*"]

[tool.setuptools.package-data]
"ai_engine.detectors.secret" = ["templates/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"
